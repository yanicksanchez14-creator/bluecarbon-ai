# BlueCarbon-AI v2 default configuration.
# Every stage (fetch -> labels -> chips -> train -> predict -> report) reads this file.

project: bluecarbon-ai            # Google Earth Engine cloud project id
workdir: runs/default             # all outputs go here

imagery:
  # Seasonal median of cloud-masked Sentinel-2 L2A (harmonized) surface reflectance.
  collection: COPERNICUS/S2_SR_HARMONIZED
  cloud_score_collection: GOOGLE/CLOUD_SCORE_PLUS/V1/S2_HARMONIZED
  cloud_score_band: cs_cdf
  clear_threshold: 0.60           # Cloud Score+ cs_cdf >= threshold is kept
  scale_m: 10
  tile_px: 512                    # computePixels request size (keeps requests < 48 MB)

labels:
  # Reference labels are fused from published global products (priority order: last wins).
  # All asset ids are configurable in case a dataset version changes.
  worldcover: ESA/WorldCover/v200             # 10 m land cover, 2021 (mangroves = 95)
  intertidal: UQ/murray/Intertidal/v1_1/global_intertidal  # tidal flats (Murray et al. 2019)
  reef_habitat: ACA/reef_habitat/v2_0         # Allen Coral Atlas benthic (seagrass = 14), tropics
  seagrass_value: 14
  # Salt marsh = herbaceous / grass / shrub cover inside the tidal zone (Murray et al. 2022 tidal
  # wetland probability >= 50%) and below this elevation (m, NASADEM). Freshwater marsh is ignored.
  marsh_max_elev_m: 5
  tidal_wetland: JCU/Murray/GIC/global_tidal_wetland_change/2019
  tidal_wetland_band: twprobability_end
  tidal_wetland_min_prob: 50
  # Extra seagrass polygons (Earth Engine FeatureCollection ids), e.g. regional eelgrass surveys.
  seagrass_vectors: []
  # Water depth (GEBCO 2023, 15 arc-second grid) is stored in ancillary.tif for reference only.
  # It is NOT used for labels or as a model input: it reads ~18 m in Florida Bay (really 1-3 m), so
  # it is unreliable in shallow bays. null = no depth-based seagrass rule.
  bathymetry: projects/sat-io/open-datasets/gebco/gebco_grid
  seagrass_max_depth_m: null
  # Regional seagrass survey maps, downloaded from public web services during `fetch` and burned in as
  # seagrass over water (see src/bluecarbon/surveys.py). They cover murky and subtropical water the
  # Allen Coral Atlas does not. `extent` = [lon_min, lat_min, lon_max, lat_max] the survey covers.
  seagrass_surveys:
    - name: fwc-florida-seagrass
      kind: arcgis
      url: https://gis.myfwc.com/hosting/rest/services/Open_Data/Seagrass_Statewide/MapServer/15
      where: "SOURCEDATE >= '2004'"   # skip 1987-2003 meadow outlines (keeps the Keys' 2004-2015 survey)
      extent: [-88.0, 24.3, -79.8, 31.1]
      negatives_within_m: 1500         # unmapped water this close to a surveyed meadow = open water
      citation: "Florida Fish and Wildlife Conservation Commission, Seagrass Statewide (1987-2025 compilation)"
    - name: seamap-moreton-bay-2015
      kind: wfs
      url: https://geoserver.imas.utas.edu.au/geoserver/seamap/wfs
      layer: SeamapAus_QLD_MoretonBay_seagrass_2015
      extent: [152.9, -27.9, 153.6, -26.9]
      negatives_within_m: 1500
      bbox_query: false
      citation: "Lyons, Roelfsema et al., Seagrass cover map for Moreton Bay (2015), Seamap Australia"
    # Seamap Australia national collection (IMAS, University of Tasmania), checked Oct 2026
    - name: seamap-gbr-seagrass-1984-2014
      kind: wfs
      url: https://geoserver.imas.utas.edu.au/geoserver/seamap/wfs
      layer: seamap:SeamapAus_QLD_GBRWHA_seagrass_2014
      extent: [142.0, -25.5, 154.0, -10.0]
      drop: {Density: ["light"]}        # sparse Halophila meadows are invisible from space
      negatives_within_m: 0             # old surveys (1987-2014): positives only
      citation: "TropWATER JCU, GBRWHA seagrass meadow boundaries 1984-2014 (NESP 3.1), via Seamap Australia"
    - name: seamap-wa-marine-habitats
      kind: wfs
      url: https://geoserver.imas.utas.edu.au/geoserver/seamap/wfs
      layer: seamap:SeamapAus_WA_DPAW_marine_habitats
      extent: [112.0, -36.0, 129.0, -13.0]
      keep: {BROADSCALE: ["seagrass"]}
      drop: {LOCALSCALE: ["sparse"]}
      negatives_within_m: 1500
      citation: "WA DPAW, Marine habitats of Western Australia 1981-2003, via Seamap Australia"
    - name: seamap-vic-statewide-habitats-2023
      kind: wfs
      url: https://geoserver.imas.utas.edu.au/geoserver/seamap/wfs
      layer: seamap:SeamapAus_VIC_statewide_habitats_2023
      extent: [140.9, -39.3, 150.1, -37.4]
      keep: {BIOT_LBL: ["seagrass"]}
      negatives_within_m: 1500
      citation: "DEECA Victoria, statewide marine habitats 2023, via Seamap Australia"
    # ---- added Oct 2026 for the expanded site list (each checked by scripts/check_surveys.py) ----
    - name: seamap-nsw-macrophytes-seagrass
      kind: wfs
      url: https://geoserver.imas.utas.edu.au/geoserver/seamap/wfs
      layer: seamap:SeamapAus_NSW_estuarine_macrophytes_2022
      extent: [149.8, -37.5, 153.6, -28.1]
      keep: {SM_HAB_CLS: ["zostera", "posidonia", "ruppia", "halophila", "seagrass"]}   # classes are taxa
      negatives_within_m: 1500
      citation: "NSW Department of Primary Industries (2022), NSW Estuarine Macrophytes, via Seamap Australia"
    - name: seamap-hervey-bay-seagrass-1998
      kind: wfs
      url: https://geoserver.imas.utas.edu.au/geoserver/seamap/wfs
      layer: seamap:SeamapAus_QLD_HerveyBay_seagrass_1998
      extent: [152.5, -26.0, 153.4, -24.6]
      negatives_within_m: 0             # 1998 survey: positives only
      citation: "McKenzie et al., Seagrass meadows of Hervey Bay and the Great Sandy Strait (1998), via Seamap Australia"
    - name: seamap-gold-coast-broadwater-seagrass-2009
      kind: wfs
      url: https://geoserver.imas.utas.edu.au/geoserver/seamap/wfs
      layer: seamap:SeamapAus_QLD_GoldCoast_Broadwater_seagrass_2009
      extent: [153.3, -28.1, 153.5, -27.7]
      negatives_within_m: 0
      citation: "Gold Coast Broadwater seagrass mapping 2005-2009, via Seamap Australia"
    - name: vims-chesapeake-sav-2020-2024
      kind: arcgis
      url: https://mobjack.vims.edu/ArcGIS/rest/services/VIMS_SAV/SAVBeds2020_2024/MapServer/0
      extent: [-77.5, 36.8, -75.0, 39.7]
      negatives_within_m: 1500          # the annual aerial survey maps every bed it flies over
      citation: "Virginia Institute of Marine Science, SAV in Chesapeake and coastal bays, 2020-2024 composite"
    - name: noaa-tpwd-texas-seagrass
      kind: arcgis
      url: https://services1.arcgis.com/1mtXwieMId59thmg/ArcGIS/rest/services/Seagrass__NOAA_Benthic_Atlas_2004/FeatureServer/0
      extent: [-97.9, 25.8, -96.3, 28.8]
      negatives_within_m: 1500
      citation: "NOAA and Texas Parks and Wildlife, Texas Benthic Atlas seagrass (2004/2007 NAIP, 87% accuracy)"
    - name: cdfw-california-eelgrass
      kind: arcgis
      url: https://services1.arcgis.com/eGSDp8lpKe5izqVc/ArcGIS/rest/services/HAB_CA_Eelgrass_161128/FeatureServer/8
      extent: [-124.5, 32.5, -117.0, 42.0]
      negatives_within_m: 0             # maximum extent over several surveys: positives only
      citation: "California eelgrass distribution (statewide compilation of bay surveys, 2016)"
    - name: massdep-eelgrass-2019-2023
      kind: zip
      url: https://s3.us-east-1.amazonaws.com/download.massgis.digital.mass.gov/shapefiles/state/eelgrass_phase6.zip
      layer: EELGRASS_PHASE6_POLY       # the zip also holds the study-area boundaries (default layer)
      extent: [-71.2, 41.2, -69.9, 42.9]
      negatives_within_m: 1500          # aerial survey with boat ground truth
      citation: "MassDEP Eelgrass Mapping Project, Phase 6 (2019-2023), via MassGIS"
    # salt marsh and mangrove survey maps (class: saltmarsh / mangrove; see surveys.burn_wetland)
    - name: usfws-nwi-salt-marsh
      kind: arcgis
      class: saltmarsh
      url: https://fwspublicservices.wim.usgs.gov/wetlandsmapservice/rest/services/Wetlands/MapServer/0
      where: "ATTRIBUTE LIKE 'E2EM%'"     # estuarine intertidal emergent = salt marsh
      extent: [-125.0, 24.3, -66.8, 49.5]
      authoritative: true
      citation: "US Fish and Wildlife Service, National Wetlands Inventory (estuarine intertidal emergent)"
    - name: usfws-nwi-mangrove
      kind: arcgis
      class: mangrove
      url: https://fwspublicservices.wim.usgs.gov/wetlandsmapservice/rest/services/Wetlands/MapServer/0
      where: "WETLAND_TYPE = 'Estuarine and Marine Wetland' AND ATTRIBUTE LIKE 'E2SS3%'"   # mangrove scrub (an OR query returns HTTP 500)
      extent: [-98.0, 24.3, -80.0, 30.5]
      citation: "US Fish and Wildlife Service, National Wetlands Inventory (estuarine broad-leaved evergreen)"
    - name: ea-england-saltmarsh-2016-2019
      kind: arcgis
      class: saltmarsh
      url: https://gisrest.defra.gov.uk/server/rest/services/EA/SaltmarshExtentsAndZonation/MapServer/0
      extent: [-6.5, 49.8, 2.0, 55.9]
      authoritative: true
      citation: "Environment Agency, Saltmarsh Extents and Zonation (aerial survey 2016-2019), Open Government Licence"
    - name: seamap-nsw-macrophytes-saltmarsh
      kind: wfs
      class: saltmarsh
      url: https://geoserver.imas.utas.edu.au/geoserver/seamap/wfs
      layer: seamap:SeamapAus_NSW_estuarine_macrophytes_2022
      extent: [149.8, -37.5, 153.6, -28.1]
      keep: {SM_HAB_CLS: ["saltmarsh"]}
      drop: {SM_HAB_CLS: ["mangrove"]}   # mixed Mangrove/Saltmarsh polygons are neither
      authoritative: true
      citation: "NSW Department of Primary Industries (2022), NSW Estuarine Macrophytes, via Seamap Australia"
    - name: seamap-nsw-macrophytes-mangrove
      kind: wfs
      class: mangrove
      url: https://geoserver.imas.utas.edu.au/geoserver/seamap/wfs
      layer: seamap:SeamapAus_NSW_estuarine_macrophytes_2022
      extent: [149.8, -37.5, 153.6, -28.1]
      keep: {SM_HAB_CLS: ["mangrove"]}
      drop: {SM_HAB_CLS: ["saltmarsh"]}
      citation: "NSW Department of Primary Industries (2022), NSW Estuarine Macrophytes, via Seamap Australia"
  # GWL_FCS30 global 30 m wetland map (Zhang et al. 2023), which has an explicit salt marsh class
  # (186; 181 swamp, 182 marsh = freshwater). Salt marsh is labelled where it agrees with
  # WorldCover vegetation; tidal-zone vegetation it does NOT call wetland is left unlabelled.
  wetland_map: projects/sat-io/open-datasets/GWL_FCS30
  wetland_year: 2021
  dem: NASA/NASADEM_HGT/001
  # Optional user polygons (GeoPackage/GeoJSON with an integer `class_id` column following
  # src/bluecarbon/schema.py). These override everything else, e.g. local eelgrass surveys.
  overrides: null
  # Pixels within this many pixels of a class boundary are set to ignore (label noise buffer).
  boundary_ignore_px: 1

chips:
  size: 256
  stride: 256                     # no overlap -> no leakage between chips
  min_labeled_frac: 0.2
  block_km: 5                     # spatial blocks for train/val/test assignment
  split: [0.7, 0.15, 0.15]
  seed: 42

model:
  arch: Unet                      # any segmentation_models_pytorch architecture (Unet, UnetPlusPlus, DeepLabV3Plus, ...)
  encoder: resnet34
  encoder_weights: imagenet       # set null to train from scratch / offline
  use_ancillary: true             # add elevation, tidal-wetland probability and |latitude| as inputs

train:
  epochs: 50                      # ~2.4x more chips per epoch with the extra years
  batch_size: 16
  lr: 3.0e-4
  weight_decay: 1.0e-4
  dice_weight: 0.5
  class_weighting: sqrt_inverse   # none | inverse | sqrt_inverse
  amp: true
  num_workers: 2
  patience: 12
  rare_oversample: 4              # chips with blue carbon habitat are drawn up to 4x more often
  device: auto

predict:
  tile: 256
  overlap: 64
  tta: true

carbon:
  # IPCC (2013) Wetlands Supplement, Tier 1 defaults.
  # soil: organic carbon stock to 1 m depth, t C / ha  [low, mode, high]
  # biomass: above + below ground living biomass carbon, t C / ha
  # accumulation: soil carbon accumulation rate, t C / ha / yr
  # Verify against Tables 4.4, 4.11 and 4.12 before citing numbers in a publication.
  co2_per_c: 3.667
  classes:
    mangrove:  {soil: [436, 471, 510], biomass: [25, 42, 80], accumulation: [1.3, 1.62, 2.0]}
    saltmarsh: {soil: [254, 255, 297], biomass: [2, 5, 10],   accumulation: [0.7, 0.91, 1.1]}
    seagrass:  {soil: [84, 108, 139],  biomass: [0.5, 1, 2],  accumulation: [0.2, 0.43, 0.7]}
  price_usd_per_tco2e: [15, 25, 40]   # indicative voluntary-market range, not a valuation
  monte_carlo: 5000
