# Kelp beds for the kelp canopy product, Baja California to Washington. Boxes are [west, south, east, north] and
# cover the nearshore band where canopy forms (giant kelp in the south and centre, bull kelp in the north).
# role: test = never used to calibrate; its scores against Kelpwatch are the published accuracy.
# zone: beds calibrated together (giant kelp and bull kelp canopy look different from space). Every other bed is
# also scored leave-one-bed-out within its zone. Kelpwatch (SBC LTER) covers Baja California to Oregon; a bed with
# no Kelpwatch pixels is mapped with its zone's settings but not scored.
landsat_start_year: 1984  # our own Landsat canopy record, 1984-2015 (Sentinel-2 takes over in 2016)
start_year: 2016          # Sentinel-2 A+B both flying from 2017; 2016 adds a partial first year
sites:
  - name: point_loma
    title: Point Loma kelp forest
    region: San Diego, California
    bbox: [-117.30, 32.64, -117.23, 32.74]
    species: giant kelp
    zone: giant kelp
  - name: la_jolla
    title: La Jolla
