# Training / evaluation sites. bbox = [lon_min, lat_min, lon_max, lat_max] (WGS84).
# Imagery year matches the ESA WorldCover 2021 reference labels.
# `role: test` sites are never used for training: they measure geographic generalization.
# `seagrass_unmapped: true` = the site has seagrass that no reference map covers, so its water outside
# the Allen Coral Atlas footprint is left unlabelled instead of being taught (or scored) as open water.

year: 2021

sites:
  - {name: mission_bay_ca,       bbox: [-117.265, 32.745, -117.185, 32.810], role: test, seagrass_unmapped: true,  note: "Held-out: Mission Bay and the Kendall-Frost Marsh Reserve, San Diego"}
  - {name: south_sd_bay_ca,      bbox: [-117.150, 32.560, -117.080, 32.640], role: train, seagrass_unmapped: true, note: "South San Diego Bay NWR salt marsh"}
  - {name: south_sf_bay_ca,      bbox: [-122.150, 37.420, -121.980, 37.550], role: train, note: "Don Edwards SF Bay NWR tidal marsh"}
  - {name: ten_thousand_isl_fl,  bbox: [-81.600, 25.800, -81.350, 26.000], role: train, seagrass_unmapped: true, note: "Mangrove forest, SW Florida"}
  - {name: florida_bay_fl,       bbox: [-81.000, 25.050, -80.750, 25.250], role: train, seagrass_unmapped: true, note: "Mangrove + seagrass, Everglades NP"}
  - {name: andros_bahamas,       bbox: [-78.100, 24.600, -77.800, 24.900], role: train, note: "Mangrove, tidal flats, seagrass"}
  - {name: laguna_terminos_mx,   bbox: [-91.900, 18.500, -91.600, 18.750], role: train, seagrass_unmapped: true, note: "Mangrove lagoon, Campeche"}
  - {name: sundarbans_bd,        bbox: [89.100, 21.700, 89.400, 22.000],   role: train, note: "World's largest mangrove forest"}
  - {name: wadden_sea_de,        bbox: [8.600, 53.800, 8.900, 54.050],     role: train, note: "Salt marsh + tidal flats, North Sea"}
  # Seagrass-rich sites mapped by the Allen Coral Atlas (added so the model sees enough seagrass)
  - {name: florida_keys_fl,      bbox: [-81.600, 24.550, -81.350, 24.800], role: train, note: "Seagrass meadows and mangrove keys, Lower Florida Keys"}
  - {name: belize_lagoon_bz,     bbox: [-88.100, 17.250, -87.850, 17.500], role: train, note: "Seagrass lagoon behind the Belize Barrier Reef"}
  - {name: exuma_bahamas,        bbox: [-76.550, 23.850, -76.300, 24.100], role: train, note: "Seagrass banks, Exuma Cays"}
  - {name: hinchinbrook_au,      bbox: [146.100, -18.350, 146.350, -18.100], role: train, note: "Mangrove and seagrass, Great Barrier Reef coast"}
  - {name: chwaka_bay_tz,        bbox: [39.400, -6.250, 39.600, -6.050],   role: train, note: "Seagrass and mangrove, Zanzibar"}
  - {name: safaga_eg,            bbox: [33.800, 26.650, 34.050, 26.900],   role: train, note: "Seagrass meadows, Red Sea"}
  # Salt marsh sites (tidal marsh on four continents) and a large subtropical seagrass bank
  - {name: sapelo_ga,            bbox: [-81.450, 31.350, -81.200, 31.550], role: train, seagrass_unmapped: true, note: "Spartina salt marsh, Georgia coast"}
  - {name: blackwater_md,        bbox: [-76.250, 38.300, -76.000, 38.450], role: train, note: "Brackish tidal marsh, Chesapeake Bay"}
  - {name: venice_lagoon_it,     bbox: [12.300, 45.420, 12.500, 45.550],   role: train, seagrass_unmapped: true, note: "Salt marshes (barene) of the northern Venice Lagoon"}
  - {name: yellow_river_cn,      bbox: [118.950, 37.650, 119.250, 37.850], role: train, note: "Salt marsh and tidal flats, Yellow River Delta"}
  - {name: shark_bay_au,         bbox: [113.700, -26.050, 113.950, -25.800], role: train, seagrass_unmapped: true, note: "Seagrass banks, Shark Bay World Heritage Area"}
  # Florida seagrass in tannic / turbid water, labelled from the FWC statewide seagrass survey
  - {name: charlotte_harbor_fl,  bbox: [-82.300, 26.650, -82.050, 26.900], role: train, seagrass_unmapped: true, note: "Seagrass and mangrove, Pine Island Sound and Charlotte Harbor"}
  - {name: cedar_key_fl,         bbox: [-83.150, 29.050, -82.900, 29.250], role: train, seagrass_unmapped: true, note: "Seagrass flats and salt marsh, Big Bend coast"}
  # ---- Expansion: more seagrass, salt marsh and mangrove on every continent ----
  # Clear-water seagrass mapped by the Allen Coral Atlas
  - {name: puerto_morelos_mx,    bbox: [-86.950, 20.750, -86.800, 20.950], role: train, note: "Seagrass lagoon behind the Mesoamerican Reef, Yucatan"}
  - {name: marawah_ae,           bbox: [53.050, 24.150, 53.350, 24.400],   role: train, note: "Seagrass beds and mangrove, Marawah Marine Biosphere Reserve"}
  - {name: bazaruto_mz,          bbox: [35.250, -21.850, 35.500, -21.550], role: train, note: "Seagrass meadows of the Bazaruto Archipelago"}
  - {name: coron_ph,             bbox: [119.950, 12.050, 120.200, 12.250], role: train, note: "Seagrass and mangrove, Calamian Islands"}
  - {name: jobos_bay_pr,         bbox: [-66.300, 17.900, -66.150, 17.980], role: train, note: "Mangrove and seagrass, Jobos Bay reserve"}
  - {name: al_wajh_sa,           bbox: [36.350, 26.050, 36.600, 26.300],   role: train, note: "Seagrass and reef lagoon, Al Wajh Bank, Red Sea"}
  # Florida seagrass in murky water, labelled from the FWC statewide survey
  - {name: st_joseph_bay_fl,     bbox: [-85.430, 29.750, -85.300, 29.900], role: train, seagrass_unmapped: true, note: "Seagrass meadows, St. Joseph Bay aquatic preserve"}
  - {name: indian_river_fl,      bbox: [-80.620, 27.800, -80.400, 28.000], role: train, seagrass_unmapped: true, note: "Seagrass and mangrove, Indian River Lagoon"}
  - {name: biscayne_bay_fl,      bbox: [-80.300, 25.450, -80.150, 25.650], role: train, seagrass_unmapped: true, note: "Seagrass and mangrove, Biscayne Bay"}
  # Temperate salt marsh
  - {name: delaware_bay_nj,      bbox: [-75.150, 39.150, -74.900, 39.350], role: train, note: "Salt marsh, Delaware Bay shore"}
  - {name: morecambe_bay_uk,     bbox: [-2.950, 54.100, -2.750, 54.250],   role: train, note: "Salt marsh and sand flats, Morecambe Bay"}
  - {name: mont_st_michel_fr,    bbox: [-1.650, 48.600, -1.400, 48.700],   role: train, note: "Salt meadows of the Bay of Mont-Saint-Michel"}
  - {name: chongming_cn,         bbox: [121.850, 31.450, 122.050, 31.600], role: train, note: "Salt marsh and tidal flats, Chongming Dongtan, Yangtze estuary"}
  - {name: bahia_blanca_ar,      bbox: [-62.400, -38.950, -62.100, -38.750], role: train, note: "Salt marsh and tidal flats, Bahia Blanca estuary"}
  - {name: westernport_au,       bbox: [145.300, -38.400, 145.550, -38.200], role: train, note: "Temperate mangrove, salt marsh and seagrass, Western Port"}
  - {name: knysna_za,            bbox: [23.000, -34.100, 23.150, -34.000], role: train, seagrass_unmapped: true, note: "Salt marsh and eelgrass, Knysna estuary"}
  # Mangrove
  - {name: ca_mau_vn,            bbox: [104.750, 8.550, 105.000, 8.800],   role: train, note: "Mangrove forest, Ca Mau peninsula, Mekong delta"}
  - {name: zambezi_delta_mz,     bbox: [36.100, -18.950, 36.400, -18.700], role: train, note: "Mangrove forest, Zambezi delta"}
  # Two more estuaries held out of training, so generalization is measured on more coastlines
  - {name: plum_island_ma,       bbox: [-70.900, 42.680, -70.780, 42.800], role: test,  note: "Held-out: Great Marsh salt marsh, Massachusetts"}
  - {name: shoalwater_bay_au,    bbox: [150.250, -22.550, 150.500, -22.300], role: test, note: "Held-out: mangrove and seagrass, Great Barrier Reef coast"}
  - {name: moreton_bay_au,       bbox: [153.100, -27.500, 153.350, -27.250], role: test, seagrass_unmapped: true, note: "Held-out: mangrove, salt marsh, seagrass"}
  - {name: tampa_bay_fl,         bbox: [-82.700, 27.600, -82.500, 27.800], role: test, seagrass_unmapped: true, note: "Held-out: mangrove + seagrass"}

# Before/after change studies shown in the demo app (and used by the site screen reports).
case_studies:
  - name: mission_bay_change
    bbox: [-117.265, 32.745, -117.185, 32.810]
    periods:
      t0: ["2018-05-01", "2018-09-30"]
      t1: ["2024-05-01", "2024-09-30"]
    labels: {t0: "Summer 2018", t1: "Summer 2024"}
    title: "Mission Bay, San Diego (2018 → 2024)"
    region: "California, USA"
    held_out: true
    description: "Salt marsh and seagrass in Mission Bay, summer 2018 compared with summer 2024. This bay was never used in training."
  - name: laguna_terminos_change
    bbox: [-91.900, 18.500, -91.600, 18.750]
    periods:
      t0: ["2019-01-01", "2020-01-01"]
      t1: ["2025-01-01", "2026-01-01"]
    labels: {t0: "2019", t1: "2025"}
    title: "Laguna de Términos, Campeche (2019 → 2025)"
    region: "Campeche, Mexico"
    held_out: false
    description: "Mangrove lagoon in Campeche, full-year 2019 compared with full-year 2025. Part of the training area for the 2021 map, not for these years."
