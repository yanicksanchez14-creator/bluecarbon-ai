[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bluecarbon"
version = "2.0.0"
description = "Map blue carbon ecosystems (mangrove, salt marsh, seagrass) from Sentinel-2 with deep learning and estimate carbon stocks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yanick Sanchez" }]
keywords = ["remote-sensing", "blue-carbon", "sentinel-2", "segmentation", "climate"]
dependencies = [
  "numpy>=1.24",
  "rasterio>=1.3",
  "torch>=2.1",
  "segmentation-models-pytorch>=0.3.3",
  "pyyaml>=6",
  "pydantic>=2",
  "typer>=0.9",
  "matplotlib>=3.7",
  "tqdm>=4.65",
  "scipy>=1.10",
  "lightgbm>=4.0",
]

[project.optional-dependencies]
gee = ["earthengine-api>=0.1.390"]
app = ["streamlit>=1.35", "folium>=0.15", "streamlit-folium>=0.20", "earthengine-api>=0.1.390", "pandas>=2", "altair>=5"]
dev = ["pytest>=7", "ruff>=0.4"]
report = ["reportlab>=4"]

[project.scripts]
bluecarbon = "bluecarbon.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
