<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site map | BlueCarbon-AI</title>
<meta name="description" content="Habitat maps, carbon estimates and downloadable reports for every coastal site mapped by BlueCarbon-AI.">
<meta name="theme-color" content="#0d1f29">
<link rel="icon" href="blank.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip" href="#panel">Skip to site details</a>
<!-- HEADER -->

<main class="explore">
  <aside class="ex-list" aria-label="Sites">
    <div class="search"><label class="skip" for="q">Search sites</label>
      <input id="q" type="search" placeholder="Search sites or countries" autocomplete="off"></div>
    <ul id="list"></ul>
  </aside>
  <div class="ex-map">
    <div id="map" aria-label="Map of the selected site"></div>
    <div class="layer-bar" id="layers" role="group" aria-label="Map layer"></div>
    <label class="opacity">Overlay <input id="opacity" type="range" min="0" max="1" step="0.05" value="0.85"></label>
    <div class="map-legend" id="legend"></div>
  </div>
  <section class="ex-panel" id="panel" aria-live="polite"></section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/common.js"></script>
<script src="js/explore.js"></script>
</body>
</html>
